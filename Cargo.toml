[package]
name = "logic_analyzer_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", features = ["defmt", "stm32h7s3l8", "unstable-pac", "time-driver-tim3", "memory-x"] }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", features = ["defmt"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy"}
embassy-sync = { git = "https://github.com/embassy-rs/embassy"}
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
static_cell = "2.1"

[[bin]]
name = "logic_analyzer_rust"
harness = false

[profile.release]
opt-level = "s" # or "z" for smallest binary size
lto = true
codegen-units = 1
debug = true # keeps debug symbols active for probe-rs / defmt

[env]
DEFMT_LOG = "info"